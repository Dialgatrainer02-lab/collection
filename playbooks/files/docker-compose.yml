

services:
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    networks:
      dnsnet:
        ipv4_address: 10.5.0.6 
        #  have to set static for coredns
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf

  etcd:
    image: quay.io/coreos/etcd:v3.6.6
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    restart: unless-stopped
    networks:
      - dnsnet
    volumes:
      - ./etcd-data:/etcd-data

  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    restart: unless-stopped
    depends_on:
      - unbound
      - etcd
    networks:
      - dnsnet
    ports:
      - "5300:53/tcp"
      - "5300:53/udp"
    volumes:
      - ./Corefile:/Corefile

networks:
  dnsnet:
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1