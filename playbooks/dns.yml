---
- name: Create a dns server
  hosts: '{{target|default("dns")}}'
  become: true
  tasks:
    - name: Make dns stack
      ansible.builtin.include_role:
        name: dialgatrainer02_lab.homelab.dns
- name: Set dns server
  hosts: "{{ target | default('all:!dns') }}"
  become: true

  tasks:
    - name: Check if network config exists
      ansible.builtin.stat:
        path: /etc/sysconfig/network-scripts/ifcfg-eth0
      register: ifcfg_eth0

    - name: Change dns server
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/network-scripts/ifcfg-eth0
        regexp: '^DNS{{ idx }}'
        line: "DNS{{ idx }}={{ hostvars[item].ansible_host }}"
      loop: "{{ groups['dns'] }}"
      loop_control:
        index_var: idx
      when:
        - ansible_distribution == "AlmaLinux"
        - ifcfg_eth0.stat.exists
      notify: Restart network
    - name: Remove existing nameserver lines
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        regexp: '^nameserver'
        state: absent
      when: 
        - ansible_distribution == "AlmaLinux"
        - ifcfg_eth0.stat.exists != true
  
    - name: Add nameservers in order (first DNS overrides first)
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "nameserver {{ hostvars[item].ansible_host }}"
        insertafter: EOF
      loop: "{{ groups['dns'] }}"
      loop_control:
        index_var: idx
      when: ansible_distribution == "AlmaLinux"
      notify: Restart network manager
  
        

  handlers:
    - name: Restart network
      ansible.builtin.systemd_service:
        name: network
        state: restarted
    - name: Restart network manager
      ansible.builtin.systemd_service:
        name: NetworkManager
        state: restarted