---
- name: Create a dns server
  hosts: '{{target|default("dns")}}'
  become: true
  tasks:
    - name: Make dns stack
      ansible.builtin.include_role:
        name: dialgatrainer02_lab.homelab.dns
      vars:
        dns_extra_entries:
          - "192.168.0.90 pve.homelab.lan"
          - "192.168.0.91 pve1.homelab.lan"
- name: Set dns server
  hosts: "{{ target | default('all:!dns') }}"
  become: true

  tasks:
    - name: Check if network config exists
      ansible.builtin.stat:
        path: /etc/sysconfig/network-scripts/ifcfg-eth0
      register: ifcfg_eth0

    - name: Change dns server
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/network-scripts/ifcfg-eth0
        regexp: '^DNS{{ idx }}'
        line: "DNS{{ idx }}={{ hostvars[item].ansible_host }}"
      loop: "{{ groups['dns'] }}"
      loop_control:
        index_var: idx
      when:
        - ansible_distribution == "AlmaLinux"
        - ifcfg_eth0.stat.exists
      notify: Restart network
    - name: network manager
      when:
        - ifcfg_eth0.stat.exists != true
        - ansible_distribution == "AlmaLinux"
      notify: Restart network manager
      block:
        - name: Read resolv.conf
          ansible.builtin.slurp:
            path: /etc/resolv.conf
          register: resolv_raw
    
        # Determine if all DNS IPs are already present
        - name: Check if DNS servers already exist
          ansible.builtin.set_fact:
            dns_already_set: >-
              {{ groups['dns'] | map('extract', hostvars, 'ansible_host') | list
                | difference(resolv_raw.content | b64decode | regex_findall('nameserver\\s+(\\S+)')) 
                | length == 0 }}
    
        # Remove existing nameserver entries ONLY if DNS is not already correct
        - name: Remove existing nameserver lines
          ansible.builtin.lineinfile:
            path: /etc/resolv.conf
            regexp: '^nameserver'
            state: absent
          when:
            - ansible_distribution == "AlmaLinux"
            - not dns_already_set
    
        # Add new nameserver entries in order
        - name: Add nameservers in order
          ansible.builtin.lineinfile:
            path: /etc/resolv.conf
            line: "nameserver {{ hostvars[item].ansible_host }}"
            insertafter: EOF
          loop: "{{ groups['dns'] }}"
          loop_control:
            index_var: idx
          when:
            - ansible_distribution == "AlmaLinux"
            - not dns_already_set
  handlers:
    - name: Restart network
      ansible.builtin.systemd_service:
        name: network
        state: restarted
    - name: Restart network manager
      ansible.builtin.systemd_service:
        name: NetworkManager
        state: restarted