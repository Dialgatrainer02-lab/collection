k8_cluster_service_network_cidr: "{{ undef() }}"

k8_cluster_cni: cilium
k8_cluster_cni_version: "{{ undef() }}" 
k8_cluster_lb: cilium
k8_cluster_lb_version: "{{ undef() }}"
k8_cluster_lb_address_range:
  - start: "192.168.0.12"
    stop: "192.168.0.233"
k8_cluster_lb_address_cidr: "{{ undef() }}"

k8_cluster_lb_qps: 40
k8_cluster_lb_burst: 50

k8_cluster_ingress: cilium