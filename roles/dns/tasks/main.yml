---
- name: Include OS-specific installation tasks
  ansible.builtin.include_tasks:
    file: "{{ ansible_distribution }}.yml"
   
- name: Configure docker deamon
  ansible.builtin.copy:
    src: deamon.json
    dest: /etc/docker/daemon.json
  notify: Restart docker
- name: Ensure sysctl params required by setup
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/docker.conf
  loop:
    - { name: "net.ipv6.conf.all.forwarding", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }
- name: Start docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: yes
- name: Make config dir
  ansible.builtin.file:
    state: directory
    path: "{{ dns_config_dir }}"
- name: Copy unbound config
  ansible.builtin.copy:
    dest: "{{ dns_config_dir }}/unbound.conf"
    src: unbound.conf
- name: Copy templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ dns_config_dir }}/{{ item }}"
  loop:
    - docker-compose.yml
    - Corefile
  notify: Restart dns
- name: Start docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ dns_config_dir }}"
    state: present
  register: output
    
